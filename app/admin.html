<body data-page="admin">
<!--
  Connexion à l'administration de la plateforme. Cette page n'est liée nulle
  part et n'est pas indexée — un confort, pas une protection : la sécurité
  tient au serveur (backend/platform_auth.py), même pour qui connaît l'adresse.
  Aucun compte ne se crée ici : seulement depuis le serveur
  (backend/tools/platform_admin.py).
-->
<div class="auth-page">
  <div class="auth-topbar">
    <span class="brand"><img src="../assets/logo.png?v=1789000492" class="brand-mark" alt="">Klassio</span>
  </div>
  <div class="auth-main">
    <form class="auth-card" id="adminForm" style="max-width:400px;" novalidate>
      <span class="auth-kicker">Administration</span>
      <h1>Accès réservé</h1>
      <p class="sub">Mot de passe et code de votre application d'authentification.</p>
      <div class="field"><label for="admEmail">E-mail</label><input type="email" id="admEmail" autocomplete="username" required /></div>
      <div class="field"><label for="admPassword">Mot de passe</label><input type="password" id="admPassword" autocomplete="current-password" required /></div>
      <div class="field"><label for="admCode">Code à 6 chiffres</label><input type="text" id="admCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required /></div>
      <p id="admError" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-lime block" id="admBtn" style="margin-top:6px;">Se connecter</button>
    </form>
  </div>
</div>
<script src="../assets/js/ui.js?v=1791400003"></script>
