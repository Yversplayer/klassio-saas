# Klassio — l'API sur Render. Les pages sont chez Cloudflare (wrangler.jsonc),
# qui relaie /api ici : le navigateur ne voit qu'un domaine.
#
# POURQUOI FRANKFURT. Ce n'est pas pour rapprocher le serveur de Kinshasa —
# aucune région Render ne le ferait vraiment. C'est pour le rapprocher de SA
# BASE. Mesuré le 18/09 : Kinshasa → Supabase (Irlande) = 270 ms d'aller-retour.
# Le tableau de bord exécute 28 requêtes SQL. Une application qui tournerait à
# Kinshasa paierait 28 × 270 ms ≈ 7,5 s pour une seule page. Depuis Francfort,
# ces 28 requêtes coûtent ~25 ms chacune, et l'utilisateur ne paie qu'UN
# aller-retour. La distance de l'utilisateur au serveur se paie une fois par
# page ; celle du serveur à la base, une fois par REQUÊTE.
#
# LE PALIER GRATUIT S'ENDORT après 15 minutes sans trafic : la requête suivante
# attend le réveil (~50 s). Acceptable pour une démonstration, pas pour une
# école qui fait l'appel le matin. À passer en payant avant le premier
# établissement réel.

services:
  - type: web
    name: klassio-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/health

    # Le schéma est appliqué AVANT que le serveur démarre. `init_db()` ne fait
    # que CREATE TABLE IF NOT EXISTS et ALTER TABLE ADD COLUMN : rejouer un
    # déploiement ne détruit rien. Si la base est injoignable, la construction
    # échoue — et c'est voulu : mieux vaut ne pas déployer qu'exposer une API
    # sans son schéma.
    buildCommand: pip install -r requirements.txt && python backend/tools/release.py

    # Mêmes réglages que le Procfile, qui est la configuration éprouvée par la
    # campagne de charge (100 utilisateurs simultanés, 0 % d'erreur).
    startCommand: >-
      gunicorn --chdir backend
      --workers 2 --threads 4 --worker-class gthread
      --timeout 60 --graceful-timeout 30
      --error-logfile - --access-logfile -
      --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: KLASSIO_DB_BACKEND
        value: postgres

      # Pas de KLASSIO_ALLOWED_ORIGINS : le Worker Cloudflare relaie /api depuis
      # le domaine des pages, le navigateur ne fait donc aucun appel croisé.

      # LA BASE : Supabase, projet en région Francfort (eu-central-1), à côté
      # de ce service. `sync: false` : Render demande la valeur à la création,
      # elle ne vit jamais dans ce dépôt public. Prendre la chaîne du POOLER
      # (Supavisor, port 5432 « session ») : la connexion directe de Supabase
      # n'a qu'une adresse IPv6, que Render ne sait pas joindre.
      - key: DATABASE_URL
        sync: false

      # Secret partagé avec le Worker Cloudflare (security.client_ip) : sans
      # lui, tous les visiteurs ont l'adresse du proxy et les limites de
      # tentatives deviennent des plafonds pour toute la plateforme. Render le
      # génère ; recopier la même valeur dans le secret KLASSIO_RELAIS_SECRET
      # du Worker.
      - key: KLASSIO_RELAIS_SECRET
        generateValue: true
